# vivapinata - Linux overrides of settings/hardware.toml and mapping.toml
#
# Loaded after hardware.toml and mapping.toml and before launcher.toml on
# Linux only (utils::LoadSettingsFiles). Flat key = value, no [Section].
#
# Linux has no Direct3D 12, so the default "Fast" render mode is Vulkan with
# the host GPU's render targets (FBO) and fast resolve readback. The
# launcher's "Accurate" mode (Vulkan fragment shader interlock) writes its own
# values to launcher.toml, which loads after this file.

graphics_backend = "vulkan"
render_target_path_vulkan = "fbo"
readback_resolve = "fast"

# XInput is Windows only; SDL reads Xbox, PlayStation and most other pads.
input_backend = "sdl"
